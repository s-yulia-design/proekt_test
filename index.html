<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -20px) scale(1.05); }
      66% { transform: translate(-20px, 15px) scale(0.95); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @keyframes pulse-ring {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.12; }
    }

    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent); }
      50% { box-shadow: 0 0 36px color-mix(in srgb, var(--accent) 55%, transparent); }
    }

    @keyframes idea-in {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes sparkle-pop {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      color: #f0f0f5;
      background: #0a0a10;
      background-image: linear-gradient(
        -45deg,
        #0a0a10,
        #1a1028,
        #10182e,
        #281018,
        #0a0a10
      );
      background-size: 400% 400%;
      animation: gradient-shift 10s ease infinite;
      overflow-x: hidden;
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: rgba(255, 80, 120, 0.45);
      top: -100px;
      right: -80px;
      animation: float 12s ease-in-out infinite;
    }

    .orb-2 {
      width: 340px;
      height: 340px;
      background: rgba(120, 100, 255, 0.4);
      bottom: -80px;
      left: -60px;
      animation: float 16s ease-in-out infinite reverse;
    }

    .orb-3 {
      width: 240px;
      height: 240px;
      background: rgba(255, 200, 50, 0.35);
      top: 50%;
      left: 50%;
      animation: pulse-ring 5s ease-in-out infinite;
    }

    main {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 2.75rem 2.5rem;
      max-width: 560px;
      width: 100%;
      box-shadow:
        0 32px 64px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(99, 102, 241, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: fade-up 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #ff6b8a;
      margin-bottom: 0.75rem;
      opacity: 0;
      animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 1.75rem;
      background: linear-gradient(90deg, #fff, #ffc4d0 45%, #c4b5fd 55%, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation:
        fade-up 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards,
        shimmer 3.5s linear 1s infinite;
      opacity: 0;
    }

    .menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.875rem;
    }

    .menu-btn {
      --accent: #6366f1;
      position: relative;
      display: flex;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 1.15rem 1.35rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 500;
      color: #f0f0f5;
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      opacity: 0;
      transition:
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.3s ease,
        border-color 0.3s ease,
        box-shadow 0.3s ease;
    }

    .menu-btn::before {
      content: attr(data-num);
      flex-shrink: 0;
      width: 2.25rem;
      height: 2.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 22%, transparent);
      border-radius: 10px;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .menu-btn .label { flex: 1; }

    .menu-btn .arrow {
      font-size: 1.25rem;
      color: var(--accent);
      opacity: 0.6;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .menu-btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 40%, white);
      transform: scale(0);
      pointer-events: none;
      animation: ripple 0.6s ease-out forwards;
    }

    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }

    .menu-btn:nth-child(1) {
      --accent: #ff5c7a;
      animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }

    .menu-btn:nth-child(2) {
      --accent: #fbbf24;
      animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
    }

    .menu-btn:nth-child(3) {
      --accent: #818cf8;
      animation: fade-up 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.65s forwards;
    }

    .menu-btn:hover {
      transform: translateX(6px) scale(1.02);
      background: rgba(255, 255, 255, 0.1);
      border-color: color-mix(in srgb, var(--accent) 45%, transparent);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
    }

    .menu-btn:hover::before {
      transform: scale(1.12) rotate(-4deg);
    }

    .menu-btn:hover .arrow {
      opacity: 1;
      transform: translateX(4px);
    }

    .menu-btn:active {
      transform: translateX(4px) scale(0.98);
    }

    .menu-btn.active {
      background: color-mix(in srgb, var(--accent) 15%, transparent);
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      animation: glow-pulse 2s ease-in-out infinite;
    }

    .menu-btn.active .arrow {
      opacity: 1;
      transform: rotate(90deg);
    }

    .sparkle {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 100;
      animation: sparkle-pop 0.5s ease-out forwards;
    }

    .output {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: none;
    }

    .output.visible {
      display: block;
      animation: fade-in 0.4s ease forwards;
    }

    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.75rem;
    }

    .output-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-refresh:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    .btn-refresh.loading .icon {
      animation: spin 0.7s linear infinite;
    }

    .ideas-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .ideas-list li {
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      border-left: 3px solid var(--output-accent, #818cf8);
      font-size: 0.95rem;
      line-height: 1.45;
      opacity: 0;
      animation: idea-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .ideas-list li:nth-child(1) { animation-delay: 0.05s; }
    .ideas-list li:nth-child(2) { animation-delay: 0.12s; }
    .ideas-list li:nth-child(3) { animation-delay: 0.19s; }
    .ideas-list li:nth-child(4) { animation-delay: 0.26s; }
    .ideas-list li:nth-child(5) { animation-delay: 0.33s; }
    .ideas-list li:nth-child(6) { animation-delay: 0.4s; }
    .ideas-list li:nth-child(7) { animation-delay: 0.47s; }

    .hint {
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.35);
      text-align: center;
      opacity: 0;
      animation: fade-up 0.6s ease 0.9s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>
  <div class="orb orb-3" aria-hidden="true"></div>

  <main>
    <span class="badge">Контент · SMM</span>
    <h1>Генератор идей для постов</h1>

    <ul class="menu" role="list">
      <li>
        <button type="button" class="menu-btn" data-type="experts" data-num="01">
          <span class="label">5 идей для экспертов</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="menu-btn" data-type="stories" data-num="02">
          <span class="label">3 идеи сториз на сегодня</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </li>
      <li>
        <button type="button" class="menu-btn" data-type="plan" data-num="03">
          <span class="label">Контент план на неделю</span>
          <span class="arrow" aria-hidden="true">→</span>
        </button>
      </li>
    </ul>

    <section class="output" id="output" aria-live="polite">
      <div class="output-header">
        <span class="output-title" id="outputTitle"></span>
        <button type="button" class="btn-refresh" id="btnRefresh">
          <span class="icon">↻</span> Ещё раз
        </button>
      </div>
      <ul class="ideas-list" id="ideasList"></ul>
    </section>

    <p class="hint">Нажмите на пункт — идеи сгенерируются мгновенно</p>
  </main>

  <script>
    const pools = {
      experts: [
        "Разбор типичной ошибки в вашей нише за 60 секунд",
        "«3 инструмента, без которых я не работаю» — личный топ",
        "Миф vs реальность: что клиенты думают неправильно",
        "Кейс: до/после с цифрами и одним выводом",
        "Ответ на частый вопрос из директ — в формате карусели",
        "Чек-лист из 7 пунктов для новичков в теме",
        "История провала и что вы из неё вынесли",
        "Сравнение двух подходов: плюсы, минусы, когда что выбрать",
        "Закулисье рабочего дня — 5 кадров без фильтров",
        "Тренд в индустрии: ваше мнение за 3 слайда"
      ],
      stories: [
        "Утро: один кадр рабочего места + опрос «Как у вас день?»",
        "Быстрый лайфхак дня — текст на ярком фоне",
        "Репост отзыва клиента с благодарностью в 2 предложениях",
        "«Спросите меня» — стикер вопросов на фото",
        "До/после за 15 секунд с таймером",
        "Мем по теме ниши — релевантный и добрый",
        "Голосование: А или Б (два варианта услуги/формата)"
      ],
      plan: [
        "Пн — экспертный пост (карусель или рилс)",
        "Вт — сториз: закулисье + опрос",
        "Ср — полезный чек-лист или инфографика",
        "Чт — кейс / отзыв клиента",
        "Пт — лёгкий контент: мем или личная история",
        "Сб — сториз-серия из 5–7 кадров",
        "Вс — итоги недели + анонс на следующую"
      ]
    };

    const titles = {
      experts: "5 идей для экспертов",
      stories: "3 идеи сториз на сегодня",
      plan: "Контент план на неделю"
    };

    const counts = { experts: 5, stories: 3, plan: 7 };
    const accents = { experts: "#ff5c7a", stories: "#fbbf24", plan: "#818cf8" };

    let currentType = null;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function spawnSparkles(x, y, color) {
      for (let i = 0; i < 8; i++) {
        const s = document.createElement("div");
        s.className = "sparkle";
        const angle = (i / 8) * Math.PI * 2;
        const dist = 20 + Math.random() * 30;
        s.style.left = x + Math.cos(angle) * dist + "px";
        s.style.top = y + Math.sin(angle) * dist + "px";
        s.style.background = color;
        s.style.width = s.style.height = 4 + Math.random() * 6 + "px";
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 500);
      }
    }

    function addRipple(btn, e) {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    function renderIdeas(type) {
      const list = document.getElementById("ideasList");
      const output = document.getElementById("output");
      const count = counts[type];
      const ideas = shuffle(pools[type]).slice(0, count);

      document.getElementById("outputTitle").textContent = titles[type];
      output.style.setProperty("--output-accent", accents[type]);
      list.innerHTML = ideas.map((t) => `<li>${t}</li>`).join("");
      output.classList.add("visible");
    }

    function generate(type, btn, e) {
      currentType = type;
      document.querySelectorAll(".menu-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      if (e) {
        addRipple(btn, e);
        spawnSparkles(e.clientX, e.clientY, accents[type]);
      }
      renderIdeas(type);
    }

    document.querySelectorAll(".menu-btn").forEach((btn) => {
      btn.addEventListener("click", (e) => generate(btn.dataset.type, btn, e));
    });

    document.getElementById("btnRefresh").addEventListener("click", function () {
      if (!currentType) return;
      this.classList.add("loading");
      setTimeout(() => {
        renderIdeas(currentType);
        this.classList.remove("loading");
      }, 400);
    });
  </script>
</body>
</html>
